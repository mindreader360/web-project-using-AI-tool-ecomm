{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">CUSTOMER RELATIONSHIPS</span><h1>Customers</h1></div><a class="button secondary" href="{{ url_for('admin.export',kind='customers') }}">Export Excel ↓</a></div><div class="panel"><p class="muted">{{ customers|length }} registered customers</p>{% for u in customers %}<div class="order-row"><div><strong>{{ u.name }}</strong><small>{{ u.email }}</small></div><span class="muted">Joined {{ u.created_at.strftime('%d %b %Y') }}</span></div>{% else %}<p>No customers yet.</p>{% endfor %}</div>{% endblock %}
