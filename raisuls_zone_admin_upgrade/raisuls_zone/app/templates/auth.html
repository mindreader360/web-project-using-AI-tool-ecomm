{% extends "base.html" %}
{% block content %}
<div class="auth-wrap"><form class="auth-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><span class="eyebrow">WELCOME TO RAISUL'S ZONE</span><h1>{{ mode }} to shop smarter.</h1>
{% if mode == 'Register' %}<label>Full name<input name="name" required maxlength="100" placeholder="Your name"></label>{% endif %}
<label>Email address<input type="email" name="email" required placeholder="you@example.com"></label>
<label>Password<input type="password" name="password" required minlength="8" placeholder="At least 8 characters"></label>
<button class="button full">{{ mode }}</button>
<p class="muted">{% if mode == 'Login' %}New here? <a href="{{ url_for('auth.register') }}">Create an account</a>{% else %}Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>{% endif %}</p></form></div>
{% endblock %}
